<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>प्रकाश ज्यास पसः - सुन र चाँदीको दर</title>
  <style>
    :root {
      --bg-cream: #F5F1E6;
      --card-bg: #FAF7F0;
      --gold-primary: #9C7A3C;
      --gold-border: #B89754;
      --table-border: #706F6D;
      --header-bg: #EFE8D8;
      --text-dark: #2B2A28;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Mukta", "Kalimati", sans-serif;
    }

    body {
      background-color: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Outer Card Frame */
    .rate-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 850px;
      padding: 35px 30px 25px 30px;
      position: relative;
      border: 1px solid var(--gold-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* Inner Double-Border Effect */
    .rate-card::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border: 1px solid var(--gold-border);
      pointer-events: none;
    }

    /* Top Decorative Line with Diamond Star */
    .top-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      position: relative;
    }

    .top-divider::before,
    .top-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: var(--gold-border);
    }

    .top-divider .diamond {
      color: var(--gold-primary);
      font-size: 1.4rem;
      padding: 0 15px;
      line-height: 1;
    }

    /* Corner Top Left L-Bracket Accent */
    .corner-bracket {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 20px;
      height: 20px;
      border-top: 3px solid var(--text-dark);
      border-left: 3px solid var(--text-dark);
    }

    /* Shop Header */
    .header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 900;
      color: var(--gold-primary);
      letter-spacing: 1px;
      text-shadow: 0.5px 0.5px 0px rgba(0,0,0,0.1);
    }

    .header::after {
      content: "";
      display: block;
      width: 100%;
      height: 2px;
      background-color: var(--gold-border);
      margin: 15px auto 0 auto;
      box-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }

    /* Grid Table Layout */
    .rate-table {
      width: 100%;
      border-collapse: collapse;
      background-color: transparent;
      border: 3px solid var(--table-border);
    }

    .rate-table th, 
    .rate-table td {
      border: 2px solid var(--table-border);
      padding: 14px 12px;
      text-align: center;
      color: var(--text-dark);
      font-size: 1.5rem;
    }

    .rate-table th {
      font-size: 1.6rem;
      font-weight: 800;
      background-color: var(--header-bg);
      border-bottom: 3px solid var(--gold-border);
    }

    /* Cells Styling */
    .date-cell {
      font-weight: 900;
      font-size: 1.55rem;
      background-color: transparent;
      vertical-align: middle;
    }

    .metal-cell {
      font-weight: 800;
      font-size: 1.5rem;
    }

    .price-cell {
      font-weight: 900;
      font-size: 1.6rem;
      letter-spacing: 0.5px;
    }

    /* Footer Status Bar */
    .footer-bar {
      margin-top: 15px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .status-tag {
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
      background: rgba(0,0,0,0.04);
      padding: 4px 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="rate-card">
    <div class="corner-bracket"></div>

    <div class="top-divider">
      <span class="diamond">✦</span>
    </div>

    <div class="header">
      <h1>प्रकाश ज्यास पसः</h1>
    </div>

    <table class="rate-table">
      <thead>
        <tr>
          <th>मिती</th>
          <th>धातु</th>
          <th>१० ग्राम</th>
          <th>१ तोला</th>
        </tr>
      </thead>
      <tbody id="rate-rows">
        <!-- Dynamic Nepali rows loaded here -->
      </tbody>
    </table>

    <div class="footer-bar">
      <span class="status-tag" id="last-updated">स्थिति: जोड्दैछ...</span>
    </div>
  </div>

  <script>
    const SHEET_ID = '15orLKgGD4GX_6TfTjChx1WxtfTXL3_JWqpLfih_NjSs';
    const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

    // Converts English numbers (0-9) to Nepali numerals (०-९)
    function toNepaliDigits(inputStr) {
      if (!inputStr) return '';
      const englishToNepali = {'0':'०', '1':'१', '2':'२', '3':'३', '4':'४', '5':'५', '6':'६', '7':'७', '8':'८', '9':'९'};
      return inputStr.toString().replace(/[0-9]/g, digit => englishToNepali[digit]);
    }

    // Translates metal names to Nepali if entered in English on Google Sheet
    function translateMetal(metalStr) {
      const lower = metalStr.toLowerCase();
      if (lower.includes('gold') || lower.includes('सुन')) return 'सुन';
      if (lower.includes('silver') || lower.includes('चाँदी') || lower.includes('चादि')) return 'चाँदी';
      return metalStr;
    }

    function formatNepaliPrice(val) {
      if (!val) return '';
      const cleanVal = val.toString().replace(/[^0-9.]/g, '');
      if (!cleanVal) return toNepaliDigits(val);
      
      const num = parseFloat(cleanVal);
      if (isNaN(num)) return toNepaliDigits(val);

      const formattedNum = num.toLocaleString('ne-NP');
      return `${formattedNum}/-`;
    }

    function renderTable(data) {
      const tbody = document.getElementById('rate-rows');
      tbody.innerHTML = '';

      const groupedByDate = {};
      data.forEach(item => {
        if (!groupedByDate[item.date]) groupedByDate[item.date] = [];
        groupedByDate[item.date].push(item);
      });

      Object.keys(groupedByDate).forEach(date => {
        const items = groupedByDate[date];
        items.forEach((row, index) => {
          const tr = document.createElement('tr');

          if (index === 0) {
            const dateTd = document.createElement('td');
            dateTd.className = 'date-cell';
            dateTd.rowSpan = items.length;
            dateTd.textContent = toNepaliDigits(date);
            tr.appendChild(dateTd);
          }

          const metalName = translateMetal(row.metal);

          const metalTd = document.createElement('td');
          metalTd.className = 'metal-cell';
          metalTd.textContent = metalName;

          const gm10Td = document.createElement('td');
          gm10Td.className = 'price-cell';
          gm10Td.textContent = formatNepaliPrice(row.gm10);

          const tola1Td = document.createElement('td');
          tola1Td.className = 'price-cell';
          tola1Td.textContent = formatNepaliPrice(row.tola1);

          tr.appendChild(metalTd);
          tr.appendChild(gm10Td);
          tr.appendChild(tola1Td);

          tbody.appendChild(tr);
        });
      });
    }

    async function loadRates() {
      try {
        const response = await fetch(`${SHEET_CSV_URL}&_=${Date.now()}`);
        if (!response.ok) throw new Error('Network response was not ok');
        
        const csvText = await response.text();
        const lines = csvText.split('\n').map(l => l.trim()).filter(l => l);

        const parsedData = [];
        let currentDate = '';

        for (let i = 0; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
          
          if (cols[0] && cols[0].toUpperCase().includes('GOLD')) continue;
          if (cols[0] && (cols[0].toUpperCase() === 'DATE' || cols[0] === 'मिती')) continue;

          if (cols[0] && cols[0].includes('-')) {
            currentDate = cols[0];
          }

          if (cols[1]) {
            parsedData.push({
              date: currentDate,
              metal: cols[1].trim(),
              gm10: cols[2] || '',
              tola1: cols[3] || ''
            });
          }
        }

        if (parsedData.length > 0) {
          renderTable(parsedData);
          document.getElementById('last-updated').textContent = 'स्थिति: लाइभ';
        } else {
          throw new Error('No data found');
        }
      } catch (err) {
        console.error(err);
        document.getElementById('last-updated').textContent = 'स्थिति: लिङ्क जाँच गर्नुहोस्';
      }
    }

    loadRates();
    setInterval(loadRates, 30000);
  </script>
</body>
</html>
