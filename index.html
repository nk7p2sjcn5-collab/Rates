<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prakash Jyasa Pasa - Gold & Silver Rates</title>
  <style>
    :root {
      --card-bg: #ffffff;
      --ink-black: #1a1a1a;
      --table-border: #222222;
      --card-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #2c2c2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Outer Paper Card Container */
    .rate-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 800px;
      padding: 30px;
      border-radius: 8px;
      box-shadow: var(--card-shadow);
      border: 2px solid #e0e0e0;
    }

    /* Shop Header */
    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--table-border);
      padding-bottom: 12px;
    }

    .header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--ink-black);
      text-transform: capitalize;
      letter-spacing: 0.5px;
    }

    /* Grid Table Layout */
    .rate-table {
      width: 100%;
      border-collapse: collapse;
      background-color: transparent;
    }

    .rate-table th, 
    .rate-table td {
      border: 2px solid var(--table-border);
      padding: 14px 18px;
      text-align: center;
      color: var(--ink-black);
      font-size: 1.25rem;
      font-weight: 600;
    }

    .rate-table th {
      font-size: 1.35rem;
      font-weight: 700;
      background-color: rgba(0, 0, 0, 0.04);
    }

    .date-cell {
      font-weight: 700;
      font-size: 1.2rem;
      background-color: rgba(0, 0, 0, 0.02);
    }

    .metal-cell {
      font-weight: 700;
      text-align: left !important;
      padding-left: 20px !important;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Clean Vector Gold & Silver Bar Graphics */
    .bar-icon {
      width: 32px;
      height: 22px;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .price-cell {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }

    /* Footer Info */
    .footer-bar {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: #333;
      padding-top: 10px;
    }

    .status-tag {
      font-size: 0.85rem;
      color: #444;
      background: rgba(0,0,0,0.06);
      padding: 4px 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="rate-card">
    <div class="header">
      <h1>Prakash Jyasa Pasa</h1>
    </div>

    <table class="rate-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Metal</th>
          <th>10 gm</th>
          <th>1 Tola</th>
        </tr>
      </thead>
      <tbody id="rate-rows">
        <!-- Rows will be injected dynamically from Google Sheet CSV -->
      </tbody>
    </table>

    <div class="footer-bar">
      <span>Auto-updated from Google Sheet</span>
      <span class="status-tag" id="last-updated">Status: Live</span>
    </div>
  </div>

  <script>
    // CSV URL generated from Google Sheets "Publish to Web"
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT-PLACEHOLDER/pub?output=csv';

    // Sample fallback data based on your Google Sheet entries
    const fallbackData = [
      { date: '2083-5-12', metal: 'Gold', gm10: '2,78,000/-', tola1: '3,22,000/-' },
      { date: '2083-5-12', metal: 'Silver', gm10: '4,189/-', tola1: '4,800/-' },
      { date: '2083-5-11', metal: 'Gold', gm10: '2,75,600/-', tola1: '3,20,000/-' },
      { date: '2083-5-11', metal: 'Silver', gm10: '4,287/-', tola1: '4,900/-' }
    ];

    // Inline SVG graphics for Gold and Silver Bars matching your reference images
    const goldBarSVG = `
      <svg class="bar-icon" viewBox="0 0 64 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 8L50 8L60 26L24 26L14 8Z" fill="#FFD700" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L14 8L4 26Z" fill="#FFC107" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L24 38L4 38Z" fill="#FFB300" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M24 26L60 26L60 38L24 38Z" fill="#FFD700" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M18 14L46 14" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </svg>
    `;

    const silverBarSVG = `
      <svg class="bar-icon" viewBox="0 0 64 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 8L50 8L60 26L24 26L14 8Z" fill="#E0E0E0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L14 8L4 26Z" fill="#BDBDBD" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L24 38L4 38Z" fill="#9E9E9E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M24 26L60 26L60 38L24 38Z" fill="#EEEEEE" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M18 14L46 14" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      </svg>
    `;

    function renderTable(data) {
      const tbody = document.getElementById('rate-rows');
      tbody.innerHTML = '';

      // Group rows by date to apply row-span for date column
      const groupedByDate = {};
      data.forEach(item => {
        if (!groupedByDate[item.date]) groupedByDate[item.date] = [];
        groupedByDate[item.date].push(item);
      });

      Object.keys(groupedByDate).forEach(date => {
        const items = groupedByDate[date];
        items.forEach((row, index) => {
          const tr = document.createElement('tr');

          // Date cell spans across all metals for that date
          if (index === 0) {
            const dateTd = document.createElement('td');
            dateTd.className = 'date-cell';
            dateTd.rowSpan = items.length;
            dateTd.textContent = date;
            tr.appendChild(dateTd);
          }

          const metalTd = document.createElement('td');
          metalTd.className = 'metal-cell';
          
          const isGold = row.metal.toLowerCase().includes('gold');
          const icon = isGold ? goldBarSVG : silverBarSVG;
          metalTd.innerHTML = `${icon} <span>${row.metal}</span>`;

          const gm10Td = document.createElement('td');
          gm10Td.className = 'price-cell';
          gm10Td.textContent = row.gm10.includes('/-') ? row.gm10 : `${row.gm10}/-`;

          const tola1Td = document.createElement('td');
          tola1Td.className = 'price-cell';
          tola1Td.textContent = row.tola1.includes('/-') ? row.tola1 : `${row.tola1}/-`;

          tr.appendChild(metalTd);
          tr.appendChild(gm10Td);
          tr.appendChild(tola1Td);

          tbody.appendChild(tr);
        });
      });
    }

    async function loadRates() {
      try {
        const res = await fetch(SHEET_CSV_URL);
        if (!res.ok) throw new Error('Sheet not accessible');
        const text = await res.text();
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        
        // Parse CSV data starting after header
        const parsedData = [];
        let currentDate = '';

        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim());
          if (cols[0] && cols[0].includes('-')) currentDate = cols[0];
          
          parsedData.push({
            date: currentDate || cols[0],
            metal: cols[1] || cols[0],
            gm10: cols[2],
            tola1: cols[3]
          });
        }

        renderTable(parsedData);
        document.getElementById('last-updated').textContent = 'Status: Updated Live';
      } catch (err) {
        // Fallback rendering if published CSV link is not configured yet
        renderTable(fallbackData);
        document.getElementById('last-updated').textContent = 'Status: Showing Saved Data';
      }
    }

    loadRates();
  </script>
</body>
</html>
