<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>प्रकाश ज्यास पसः - सुन र चाँदीको दर</title>
  <style>
    :root {
      --card-bg: #ffffff;
      --ink-black: #1a1a1a;
      --table-border: #222222;
      --card-shadow: 0 10px 25px rgba(0,0,0,0.15);
      --gold-primary: #D4AF37;
      --gold-dark: #B8860B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Mukta", "Kalimati", sans-serif;
    }

    body {
      background-color: #2c2c2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Card Container */
    .rate-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 800px;
      padding: 30px;
      border-radius: 8px;
      box-shadow: var(--card-shadow);
      border: 2px solid #e0e0e0;
    }

    /* Shop Header */
    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--gold-primary);
      padding-bottom: 12px;
    }

    /* Golden Metallic Title */
    .header h1 {
      font-size: 2.7rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.15);
    }

    /* Grid Table Layout */
    .rate-table {
      width: 100%;
      border-collapse: collapse;
      background-color: transparent;
    }

    .rate-table th, 
    .rate-table td {
      border: 2px solid var(--table-border);
      padding: 14px 18px;
      text-align: center;
      color: var(--ink-black);
    }

    .rate-table th {
      font-size: 1.4rem;
      font-weight: 700;
      background-color: rgba(0, 0, 0, 0.04);
    }

    /* Date font styling */
    .date-cell {
      font-weight: 800;
      font-size: 1.4rem;
      background-color: rgba(0, 0, 0, 0.02);
    }

    .metal-cell {
      font-weight: 700;
      font-size: 1.3rem;
      text-align: left !important;
      padding-left: 20px !important;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Vector Bar Logos */
    .bar-icon {
      width: 32px;
      height: 22px;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* Big & bold price numbers */
    .price-cell {
      font-weight: 900;
      font-size: 1.65rem;
      letter-spacing: 0.5px;
    }

    /* Footer Status Bar */
    .footer-bar {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 10px;
    }

    .status-tag {
      font-size: 0.85rem;
      font-weight: 600;
      color: #444;
      background: rgba(0,0,0,0.06);
      padding: 4px 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="rate-card">
    <div class="header">
      <h1>प्रकाश ज्यास पसः</h1>
    </div>

    <table class="rate-table">
      <thead>
        <tr>
          <th>मिती</th>
          <th>धातु</th>
          <th>१० ग्राम</th>
          <th>१ तोला</th>
        </tr>
      </thead>
      <tbody id="rate-rows">
        <!-- Dynamic Nepali rows loaded here -->
      </tbody>
    </table>

    <div class="footer-bar">
      <span class="status-tag" id="last-updated">स्थिति: जोड्दैछ...</span>
    </div>
  </div>

  <script>
    const SHEET_ID = '15orLKgGD4GX_6TfTjChx1WxtfTXL3_JWqpLfih_NjSs';
    const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

    const goldBarSVG = `
      <svg class="bar-icon" viewBox="0 0 64 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 8L50 8L60 26L24 26L14 8Z" fill="#FFD700" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L14 8L4 26Z" fill="#FFC107" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L24 38L4 38Z" fill="#FFB300" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M24 26L60 26L60 38L24 38Z" fill="#FFD700" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M18 14L46 14" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </svg>
    `;

    const silverBarSVG = `
      <svg class="bar-icon" viewBox="0 0 64 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 8L50 8L60 26L24 26L14 8Z" fill="#E0E0E0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L14 8L4 26Z" fill="#BDBDBD" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L24 38L4 38Z" fill="#9E9E9E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M24 26L60 26L60 38L24 38Z" fill="#EEEEEE" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M18 14L46 14" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      </svg>
    `;

    // Converts English numbers (0-9) to Nepali numerals (०-९)
    function toNepaliDigits(inputStr) {
      if (!inputStr) return '';
      const englishToNepali = {'0':'०', '1':'१', '2':'२', '3':'३', '4':'४', '5':'५', '6':'६', '7':'७', '8':'८', '9':'९'};
      return inputStr.toString().replace(/[0-9]/g, digit => englishToNepali[digit]);
    }

    // Translates metal names to Nepali if entered in English on Google Sheet
    function translateMetal(metalStr) {
      const lower = metalStr.toLowerCase();
      if (lower.includes('gold') || lower.includes('सुन')) return 'सुन';
      if (lower.includes('silver') || lower.includes('चाँदी') || lower.includes('चादि')) return 'चाँदी';
      return metalStr;
    }

    function formatNepaliPrice(val) {
      if (!val) return '';
      const cleanVal = val.toString().replace(/[^0-9.]/g, '');
      if (!cleanVal) return toNepaliDigits(val);
      
      const num = parseFloat(cleanVal);
      if (isNaN(num)) return toNepaliDigits(val);

      const formattedNum = num.toLocaleString('ne-NP');
      return `${formattedNum}/–`;
    }

    function renderTable(data) {
      const tbody = document.getElementById('rate-rows');
      tbody.innerHTML = '';

      const groupedByDate = {};
      data.forEach(item => {
        if (!groupedByDate[item.date]) groupedByDate[item.date] = [];
        groupedByDate[item.date].push(item);
      });

      Object.keys(groupedByDate).forEach(date => {
        const items = groupedByDate[date];
        items.forEach((row, index) => {
          const tr = document.createElement('tr');

          if (index === 0) {
            const dateTd = document.createElement('td');
            dateTd.className = 'date-cell';
            dateTd.rowSpan = items.length;
            dateTd.textContent = toNepaliDigits(date);
            tr.appendChild(dateTd);
          }

          const metalName = translateMetal(row.metal);
          const isGold = metalName === 'सुन';
          const icon = isGold ? goldBarSVG : silverBarSVG;

          const metalTd = document.createElement('td');
          metalTd.className = 'metal-cell';
          metalTd.innerHTML = `${icon} <span>${metalName}</span>`;

          const gm10Td = document.createElement('td');
          gm10Td.className = 'price-cell';
          gm10Td.textContent = formatNepaliPrice(row.gm10);

          const tola1Td = document.createElement('td');
          tola1Td.className = 'price-cell';
          tola1Td.textContent = formatNepaliPrice(row.tola1);

          tr.appendChild(metalTd);
          tr.appendChild(gm10Td);
          tr.appendChild(tola1Td);

          tbody.appendChild(tr);
        });
      });
    }

    async function loadRates() {
      try {
        const response = await fetch(`${SHEET_CSV_URL}&_=${Date.now()}`);
        if (!response.ok) throw new Error('Network response was not ok');
        
        const csvText = await response.text();
        const lines = csvText.split('\n').map(l => l.trim()).filter(l => l);

        const parsedData = [];
        let currentDate = '';

        for (let i = 0; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
          
          if (cols[0] && cols[0].toUpperCase().includes('GOLD')) continue;
          if (cols[0] && (cols[0].toUpperCase() === 'DATE' || cols[0] === 'मिती')) continue;

          if (cols[0] && cols[0].includes('-')) {
            currentDate = cols[0];
          }

          if (cols[1]) {
            parsedData.push({
              date: currentDate,
              metal: cols[1].trim(),
              gm10: cols[2] || '',
              tola1: cols[3] || ''
            });
          }
        }

        if (parsedData.length > 0) {
          renderTable(parsedData);
          document.getElementById('last-updated').textContent = 'स्थिति: लाइभ';
        } else {
          throw new Error('No data found');
        }
      } catch (err) {
        console.error(err);
        document.getElementById('last-updated').textContent = 'स्थिति: लिङ्क जाँच गर्नुहोस्';
      }
    }

    loadRates();
    setInterval(loadRates, 30000);
  </script>
</body>
</html>
