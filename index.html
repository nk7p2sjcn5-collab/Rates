<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prakash Jyasa Pasa - Gold & Silver Rates</title>
  <style>
    :root {
      --card-bg: #ffffff;
      --ink-black: #1a1a1a;
      --table-border: #222222;
      --card-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #2c2c2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Card Container */
    .rate-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 800px;
      padding: 30px;
      border-radius: 8px;
      box-shadow: var(--card-shadow);
      border: 2px solid #e0e0e0;
    }

    /* Shop Header */
    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--table-border);
      padding-bottom: 12px;
    }

    .header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--ink-black);
      text-transform: capitalize;
      letter-spacing: 0.5px;
    }

    /* Grid Table Layout */
    .rate-table {
      width: 100%;
      border-collapse: collapse;
      background-color: transparent;
    }

    .rate-table th, 
    .rate-table td {
      border: 2px solid var(--table-border);
      padding: 14px 18px;
      text-align: center;
      color: var(--ink-black);
      font-size: 1.25rem;
      font-weight: 600;
    }

    .rate-table th {
      font-size: 1.35rem;
      font-weight: 700;
      background-color: rgba(0, 0, 0, 0.04);
    }

    .date-cell {
      font-weight: 700;
      font-size: 1.2rem;
      background-color: rgba(0, 0, 0, 0.02);
    }

    .metal-cell {
      font-weight: 700;
      text-align: left !important;
      padding-left: 20px !important;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Vector Bar Logos */
    .bar-icon {
      width: 32px;
      height: 22px;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .price-cell {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }

    /* Footer Status Bar */
    .footer-bar {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      font-weight: 600;
      color: #333;
      padding-top: 10px;
    }

    .status-tag {
      font-size: 0.85rem;
      color: #444;
      background: rgba(0,0,0,0.06);
      padding: 4px 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="rate-card">
    <div class="header">
      <h1>Prakash Jyasa Pasa</h1>
    </div>

    <table class="rate-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Metal</th>
          <th>10 gm</th>
          <th>1 Tola</th>
        </tr>
      </thead>
      <tbody id="rate-rows">
        <!-- Live rows injected here -->
      </tbody>
    </table>

    <div class="footer-bar">
      <span>Auto-updated from Google Sheet</span>
      <span class="status-tag" id="last-updated">Status: Connecting...</span>
    </div>
  </div>

  <script>
    // Direct CSV export link using your sheet ID
    const SHEET_ID = '15orLKgGD4GX_6TfTjChx1WxtfTXL3_JWqpLfih_NjSs';
    const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

    const goldBarSVG = `
      <svg class="bar-icon" viewBox="0 0 64 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 8L50 8L60 26L24 26L14 8Z" fill="#FFD700" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L14 8L4 26Z" fill="#FFC107" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L24 38L4 38Z" fill="#FFB300" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M24 26L60 26L60 38L24 38Z" fill="#FFD700" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M18 14L46 14" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      </svg>
    `;

    const silverBarSVG = `
      <svg class="bar-icon" viewBox="0 0 64 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 8L50 8L60 26L24 26L14 8Z" fill="#E0E0E0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L14 8L4 26Z" fill="#BDBDBD" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M4 26L24 26L24 38L4 38Z" fill="#9E9E9E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M24 26L60 26L60 38L24 38Z" fill="#EEEEEE" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
        <path d="M18 14L46 14" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      </svg>
    `;

    function formatNumber(val) {
      if (!val) return '';
      const cleanVal = val.toString().replace(/[^0-9.]/g, '');
      if (!cleanVal) return val;
      const num = parseFloat(cleanVal);
      return isNaN(num) ? val : num.toLocaleString('en-IN');
    }

    function renderTable(data) {
      const tbody = document.getElementById('rate-rows');
      tbody.innerHTML = '';

      const groupedByDate = {};
      data.forEach(item => {
        if (!groupedByDate[item.date]) groupedByDate[item.date] = [];
        groupedByDate[item.date].push(item);
      });

      Object.keys(groupedByDate).forEach(date => {
        const items = groupedByDate[date];
        items.forEach((row, index) => {
          const tr = document.createElement('tr');

          if (index === 0) {
            const dateTd = document.createElement('td');
            dateTd.className = 'date-cell';
            dateTd.rowSpan = items.length;
            dateTd.textContent = date;
            tr.appendChild(dateTd);
          }

          const metalTd = document.createElement('td');
          metalTd.className = 'metal-cell';
          const isGold = row.metal.toLowerCase().includes('gold');
          const icon = isGold ? goldBarSVG : silverBarSVG;
          metalTd.innerHTML = `${icon} <span>${row.metal}</span>`;

          const gm10Td = document.createElement('td');
          gm10Td.className = 'price-cell';
          const fmtGm10 = formatNumber(row.gm10);
          gm10Td.textContent = fmtGm10.includes('/-') ? fmtGm10 : `${fmtGm10}/-`;

          const tola1Td = document.createElement('td');
          tola1Td.className = 'price-cell';
          const fmtTola1 = formatNumber(row.tola1);
          tola1Td.textContent = fmtTola1.includes('/-') ? fmtTola1 : `${fmtTola1}/-`;

          tr.appendChild(metalTd);
          tr.appendChild(gm10Td);
          tr.appendChild(tola1Td);

          tbody.appendChild(tr);
        });
      });
    }

    async function loadRates() {
      try {
        // Cache buster guarantees fresh sheet fetch every time
        const response = await fetch(`${SHEET_CSV_URL}&_=${Date.now()}`);
        if (!response.ok) throw new Error('Sheet network error');
        
        const csvText = await response.text();
        const lines = csvText.split('\n').map(l => l.trim()).filter(l => l);

        const parsedData = [];
        let currentDate = '';

        for (let i = 0; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
          
          // Skip main title row if present
          if (cols[0] && cols[0].toUpperCase().includes('GOLD & SILVER')) continue;
          // Skip column headers
          if (cols[0] && cols[0].toUpperCase() === 'DATE') continue;

          if (cols[0] && cols[0].includes('-')) {
            currentDate = cols[0];
          }

          if (cols[1] && (cols[1].toUpperCase().includes('GOLD') || cols[1].toUpperCase().includes('SILVER'))) {
            parsedData.push({
              date: currentDate,
              metal: cols[1].trim(),
              gm10: cols[2] || '',
              tola1: cols[3] || ''
            });
          }
        }

        if (parsedData.length > 0) {
          renderTable(parsedData);
          document.getElementById('last-updated').textContent = 'Status: Live';
        } else {
          throw new Error('No valid data parsed');
        }
      } catch (err) {
        console.error(err);
        document.getElementById('last-updated').textContent = 'Status: Check Sheet Sharing Permissions';
      }
    }

    loadRates();
    // Auto refresh rate data every 30 seconds
    setInterval(loadRates, 30000);
  </script>
</body>
</html>
